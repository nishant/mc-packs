# Releases master on minecraft.nish.software by itself: CLAUDE.md's "Ship every change" steps 2-3 (publish-packs, pack-docs and
# its check, check-site realm, the hosting PR merged = the deploy, then check-live), run by tools/ci-release.mjs once the
# check workflow passed on a push to master (or by hand: Actions > release > Run workflow). The notes come from
# release/notes.json, written in the same PR as the change (tools/release-notes.mjs, in npm run check).
#
# It needs the secret HOSTING_TOKEN (a fine-grained token with Contents and Pull requests read and write on
# nishant/hosting; see "Releases from CI" in docs/WORKING.md). Without it the workflow only writes a summary saying
# how to add it, and succeeds. It is idempotent: with nothing new to publish and an up-to-date realm page it opens no
# PR and only runs check-live, so a rerun does no harm. This workflow is the only release path: sessions never publish.
#
# Pack files are not committed to hosting. Every pack version is an asset of the packs-<slug> release of this repo, and
# hosting's deploy fetches the newest 5 versions of each pack from there. So the assets must exist before the hosting PR
# that lists a version merges, and the work is three jobs, so the token that can write this repo's releases never runs a
# package install:
#   release  builds, commits and opens the hosting PR (ci-release.mjs --open-pr) without merging it, and hands the new
#            .mcpack files to the next job as the artifact `packs`;
#   upload   (GITHUB_TOKEN with contents: write; node built-ins and gh only) uploads every .mcpack on disk that has no
#            asset yet (archive-packs --upload --keep 0), then checks that the newest 5 versions of every pack have
#            assets (--check). It always runs, even with no PR, so the first run after this shipped backfilled the
#            versions that then existed only in hosting git;
#   merge    merges the hosting PR (ci-release.mjs --merge-pr; that is the deploy) and runs check-live.
name: release
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [master]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  token:
    # Only after check succeeded on a push to master (not on a pull request's run), or when started by hand.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          HOSTING_TOKEN: ${{ secrets.HOSTING_TOKEN }}
        run: |
          if [ -n "$HOSTING_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Release skipped: no HOSTING_TOKEN"
            echo
            echo "This workflow publishes master on minecraft.nish.software through a PR in nishant/hosting, and needs a token for it."
            echo
            echo "1. GitHub > Settings > Developer settings > Fine-grained tokens > Generate new token: resource owner \`nishant\`,"
            echo "   only the repository \`nishant/hosting\`, permissions **Contents: Read and write** and **Pull requests: Read and write**."
            echo "2. nishant/mc-packs > Settings > Secrets and variables > Actions > New repository secret: name \`HOSTING_TOKEN\`, the token as its value."
            echo "3. Actions > release > Run workflow (or merge the next change)."
            echo
            echo "Until then nothing is released: nothing publishes from a session, CI is the only release path."
          } >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: token
    if: needs.token.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      branch: ${{ steps.release.outputs.branch }}
    steps:
      - name: Check out mc-packs master
        uses: actions/checkout@v4
        with:
          ref: master # the newest master, so a run that waited in the queue releases everything merged meanwhile
          path: mc-packs
          fetch-depth: 0
      - name: Check out nishant/hosting
        uses: actions/checkout@v4
        with:
          repository: nishant/hosting
          ref: master
          token: ${{ secrets.HOSTING_TOKEN }}
          path: hosting
          fetch-depth: 0 # publish-packs compares with hosting's origin/master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc-packs/package-lock.json
      # publish-packs runs mc-packs' catalog checks (admin-catalog.mjs reads @minecraft/server's typings), so mc-packs
      # needs its packages; without them the first release run failed with "Cannot find module '@minecraft/server/...'".
      - name: Install the mc-packs tools
        working-directory: mc-packs
        run: npm ci
      # hosting/minecraft has no lockfile: marked and Playwright.
      - name: Install the hosting tools
        working-directory: hosting/minecraft
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Release (open the hosting PR, do not merge it)
        id: release
        env:
          GH_TOKEN: ${{ secrets.HOSTING_TOKEN }}
          ARCHIVE_READ_TOKEN: ${{ github.token }}
        run: |
          git -C hosting config user.name "mc-packs release"
          git -C hosting config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node mc-packs/tools/ci-release.mjs --hosting hosting --from mc-packs --open-pr
      # The pack files on disk (fetched newest versions plus any new build) for the upload job. The only include pattern's
      # fixed prefix is hosting/minecraft/site/packs, so the artifact keeps <slug>/<file> relative to it; the excluded
      # latest.mcpack copies are not assets.
      - name: Hand the pack files to the upload job
        uses: actions/upload-artifact@v4
        with:
          name: packs
          path: |
            hosting/minecraft/site/packs/**/*.mcpack
            !hosting/minecraft/site/packs/**/latest.mcpack
          if-no-files-found: ignore
          retention-days: 3
  upload:
    # Puts every pack version into its packs-<slug> release before the hosting PR can merge. It installs nothing: node
    # built-ins and the gh CLI only.
    needs: [token, release]
    if: needs.token.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out nishant/hosting
        uses: actions/checkout@v4
        with:
          repository: nishant/hosting
          ref: ${{ needs.release.outputs.branch || 'master' }}
          token: ${{ secrets.HOSTING_TOKEN }}
          persist-credentials: false
          path: hosting
          fetch-depth: 1
      # No artifact when nothing was on disk.
      - name: Download the pack files
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: packs
          path: hosting/minecraft/site/packs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload every pack version that has no asset yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: node hosting/minecraft/tools/archive-packs.mjs --upload --keep 0 --repo ${{ github.repository }}
      - name: Check the newest 5 versions of every pack have assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node hosting/minecraft/tools/archive-packs.mjs --check --keep 5 --repo ${{ github.repository }}
  merge:
    # Merging the hosting PR is the deploy, so it waits for the upload job.
    needs: [token, release, upload]
    if: needs.release.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out mc-packs master
        uses: actions/checkout@v4
        with:
          ref: master
          path: mc-packs
          fetch-depth: 0
      - name: Check out nishant/hosting
        uses: actions/checkout@v4
        with:
          repository: nishant/hosting
          ref: master
          token: ${{ secrets.HOSTING_TOKEN }}
          path: hosting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc-packs/package-lock.json
      - name: Install the mc-packs tools
        working-directory: mc-packs
        run: npm ci
      - name: Install the hosting tools
        working-directory: hosting/minecraft
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Merge the hosting PR and check the live site
        env:
          GH_TOKEN: ${{ secrets.HOSTING_TOKEN }}
        run: |
          git -C hosting config user.name "mc-packs release"
          git -C hosting config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node mc-packs/tools/ci-release.mjs --hosting hosting --from mc-packs --merge-pr ${{ needs.release.outputs.branch }}
