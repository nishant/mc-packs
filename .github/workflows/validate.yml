# Full validation after a release (docs/WORKING.md "Testing in CI"): every merge to master runs the long work that no
# longer blocks a release, every job at once (14 runners by default; the repository variable VALIDATE_PARALLEL or the
# run's `parallel` input sets 1-20; the repo is public, so GitHub-hosted minutes are free), in about 31 minutes:
#   soak-10, soak-40 (15 min each; 10 and 40 players only, owner answer October 20, 2026): the profiled perf soak, the
#     base and this commit back to back on the same runner (runners differ by 10-40%, so only a same-runner pair shows
#     a change). The base is the newest master commit whose push validation finished (not canceled), so merges whose
#     runs were canceled are still compared (tools/test-bds/lib/validate-base.mjs); the report says how many commits
#     the pair spans;
#   bundle-10, bundle-40 (5 min each run): the genuine one-context Realm Bundle under the same soak, both trees built, one
#     harness, run base, head, head, base and compared by lows and means (PIPE-07);
#   listener (about 30 min): the idle bundle unprofiled (run.mjs --meter) with no events, 20 noop: events a tick and 20
#     realm: events a tick, base and head, three rounds: the CPU of one script event listener wake-up (examples/listener-cost.js),
#     then one short --native-profile pass;
#   every soak and bundle job pins noon and clear weather and adds perf-soak's phases (empty, one, ramp, steady, churn;
#     bundle-40 also a 60 s night in a thunderstorm): only the steady window is compared and judged;
#   suite-1..8: the whole BDS scenario suite, split by the last run's seconds.
# The memory soak (memory-40-head, 60 min unprofiled, bedrock_server RSS every 10 s, F74) runs nightly instead, when
# master moved: its base is the previous nightly's head RSS (memory doesn't depend on runner speed the way ms/tick
# does), and memory-40-base runs only when that artifact is gone. A dispatch with `memory` adds both memory sides.
# Started by hand with `scenarios` (on any branch, against `base`), it runs only scenario A/B pairs instead: one job
# per entry, each the scenario's own plan profiled on the base and the head tree back to back on one runner
# (tools/test-bds/scenario-soak.mjs), `repeat` pairs in alternating order; for per-pack perf scenarios such as
# gear-perf that the soaks don't exercise.
# Soak and bundle jobs also upload each side's full profile JSON and run.mjs output (<side>.perf-<n>.json / .out).
# Once a week (Sundays) an A/A run measures the noise: the soak, bundle and listener jobs with the base equal to the
# head (a dispatch whose base resolves to the head is one too). Its differences are stored (perf-history.json, cached)
# and printed next to every later comparison of the same job, and every report has a drift table against a pinned
# baseline run (the first report with none, or a dispatch with `pin`).
# Then one report: a job summary and an issue labeled perf-report with every table, and the scenario seconds cached
# for pr-tests.yml's shards. Budgets are reported, not enforced here: the run is red only for a failed scenario or a
# same-runner regression (tools/test-bds/perf-compare.mjs). Fixes go on a perf branch and ship as a later release.
name: validate
on:
  push:
    branches: [master]
  schedule:
    - cron: "17 8 * * *" # the nightly memory soak, 02:17 CST / 03:17 CDT
    - cron: "41 9 * * 0" # the weekly A/A run, Sundays 03:41 CST / 04:41 CDT
  workflow_dispatch:
    inputs:
      parallel:
        description: "Runners at a time (1-20)"
        default: "14"
      quick:
        description: "60 s soaks and a 10 min memory soak (to try the workflow itself)"
        type: boolean
        default: false
      memory:
        description: "Also run the memory soaks at 40 players (both sides; otherwise they run nightly)"
        type: boolean
        default: false
      base:
        description: "Base branch or commit for the A/B pairs (default on master: the last commit with a finished validation; elsewhere the first parent)"
        default: ""
      scenarios:
        description: "Only these scenario A/B pairs, separated by ';': name [run.mjs args], e.g. gear-perf --arg players=40 --arg seconds=120 --timeout 3000"
        default: ""
      repeat:
        description: "Scenario pairs per entry, alternating the order (1-3)"
        default: "1"
      pin:
        description: "Pin this run's heads as the drift baseline"
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  # The nightly memory soak has its own group, so it never cancels a merge's queued validation.
  # The weekly A/A run has its own group too.
  group: validate-${{ github.event_name == 'schedule' && (github.event.schedule == '41 9 * * 0' && 'aa' || 'nightly') || github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: read } # earlier validate runs and their artifacts
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      parallel: ${{ steps.plan.outputs.parallel }}
      base: ${{ steps.plan.outputs.base }}
      span: ${{ steps.plan.outputs.span }}
      from: ${{ steps.plan.outputs.from }}
      reuse: ${{ steps.plan.outputs.reuse }}
      skip: ${{ steps.plan.outputs.skip }}
      aa: ${{ steps.plan.outputs.aa }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: suite-times.json
          key: suite-times-${{ github.sha }}
          restore-keys: suite-times-
      - id: plan
        env:
          PARALLEL: ${{ inputs.parallel || vars.VALIDATE_PARALLEL || '14' }}
          QUICK: ${{ inputs.quick && '1' || '' }}
          MEMORY: ${{ inputs.memory && '1' || '' }}
          NIGHTLY: ${{ github.event_name == 'schedule' && github.event.schedule != '41 9 * * 0' && '1' || '' }}
          WEEKLY_AA: ${{ github.event_name == 'schedule' && github.event.schedule == '41 9 * * 0' && '1' || '' }}
          BASE: ${{ inputs.base }}
          SCENARIOS: ${{ inputs.scenarios }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          runs() { gh api "repos/$REPO/actions/workflows/validate.yml/runs?branch=master&event=$1&status=completed&per_page=30" > runs.json || echo '{}' > runs.json; }
          field() { node -e 'console.log(JSON.parse(process.argv[1])[process.argv[2]] ?? "")' "$1" "$2"; }
          skip="" reuse="" from="" span="" aa=""
          if [ -n "$WEEKLY_AA" ]; then
            base=$(git rev-parse HEAD); from="the head itself (weekly A/A)"
          elif [ -n "$NIGHTLY" ]; then
            # The nightly memory soak: nothing to do when master has not moved since the last one; its head RSS is
            # tonight's base when that artifact still exists.
            runs schedule
            prev=$(node tools/test-bds/lib/validate-base.mjs --memory --runs runs.json)
            if [ "$(field "$prev" same)" = true ]; then skip=true; echo "master has not moved since the last nightly memory soak"; fi
            run=$(field "$prev" run)
            if [ -n "$run" ] && [ "$(gh api "repos/$REPO/actions/runs/$run/artifacts?name=validate-memory-40-head" --jq '[.artifacts[] | select(.expired == false)] | length' 2>/dev/null || echo 0)" != 0 ]; then
              reuse=$run; base=$(field "$prev" base); from="the previous nightly memory soak (run $run)"
            else
              base=$(git rev-parse HEAD^1); from="first parent"
            fi
          elif [ -n "$BASE" ]; then
            # A branch name resolves on origin first (a dispatch's base is usually another branch).
            base=$(git rev-parse --verify --quiet "origin/$BASE^{commit}" || git rev-parse --verify "$BASE^{commit}"); from="the base input"
          elif [ "$GITHUB_REF" = refs/heads/master ]; then
            runs push
            info=$(node tools/test-bds/lib/validate-base.mjs --runs runs.json)
            base=$(field "$info" base); from=$(field "$info" from)
          else
            base=$(git rev-parse HEAD^1); from="first parent"
          fi
          # An A/A run: the base is the head (the weekly run, or a dispatch whose base resolves to it). Only the pairs run.
          if [ -z "$NIGHTLY" ] && [ "$base" = "$(git rev-parse HEAD)" ]; then aa=true; echo "A/A run: the base is the head"; fi
          span=$(git rev-list --first-parent --count "$base..HEAD" 2>/dev/null || echo "")
          echo "base $base ($from), $span commit(s) on the first-parent line"
          node tools/test-bds/affected.mjs --all --shards 8 --times suite-times.json > plan.json
          AA="$aa" REUSE="$reuse" node > matrix.json <<'EOF'
          const q = process.env.QUICK === "1";
          const s = (long) => (q ? 60 : long);
          const mem = (side) => ({ name: `memory-40-${side}`, kind: "memory", side, players: 40, seconds: q ? 600 : 3600 });
          const specs = (process.env.SCENARIOS || "").split(";").map((x) => x.trim().replace(/\s+/g, " ")).filter(Boolean);
          // The name is a dispatch input that reaches job names and artifact names: letters, digits, _ . - only.
          for (const spec of specs) if (!/^[A-Za-z0-9_.-]+$/.test(spec.split(" ")[0])) throw new Error(`Bad scenario name in "${spec}": use only letters, digits, _ . -`);
          const jobs = process.env.NIGHTLY
            ? [mem("head"), ...(process.env.REUSE ? [] : [mem("base")])]
            : specs.length
              ? specs.map((spec, i) => ({ name: `scenario-${i + 1}-${spec.split(" ")[0]}`, kind: "scenario", spec }))
              : [
                  // perfargs: perf-soak's phases (empty, one, ramp, steady, churn) and, at 40 in the bundle, a stormy night.
                  { name: "soak-10", kind: "soak", players: 10, seconds: s(900), perfargs: "phases=1" },
                  { name: "soak-40", kind: "soak", players: 40, seconds: s(900), perfargs: "phases=1" },
                  { name: "bundle-10", kind: "bundle", players: 10, seconds: s(300), perfargs: "phases=1" },
                  { name: "bundle-40", kind: "bundle", players: 40, seconds: s(300), perfargs: "phases=1 night=60" },
                  { name: "listener", kind: "listener", seconds: s(60) },
                  // An A/A run is the pairs only: the suite and the memory soak compare nothing.
                  ...(process.env.MEMORY && !process.env.AA ? [mem("base"), mem("head")] : []),
                  ...(process.env.AA ? [] : require("./plan.json").shards.map((x) => ({ name: `suite-${x.index}`, kind: "suite", filter: x.filter }))),
                ];
          console.log(JSON.stringify({ include: jobs }));
          EOF
          {
            echo "matrix=$(cat matrix.json)"
            echo "parallel=$(node -e 'console.log(Math.max(1, Math.min(20, Math.floor(Number(process.env.PARALLEL)) || 14)))')"
            echo "base=$base"
            echo "span=$span"
            echo "from=$from"
            echo "reuse=$reuse"
            echo "skip=$skip"
            echo "aa=$aa"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    env:
      KIND: ${{ matrix.kind }}
      PLAYERS: ${{ matrix.players }}
      SECONDS_: ${{ matrix.seconds }}
      FILTER: ${{ matrix.filter }}
      SPEC: ${{ matrix.spec }}
      SIDE: ${{ matrix.side }}
      # suite.mjs --perf hands these to perf-soak (an older suite.mjs on a base tree ignores the variable).
      PERF_SOAK_ARGS: ${{ matrix.perfargs }}
      REPEAT: ${{ inputs.repeat || '1' }}
      BASE_SHA: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bds
      # The last run's scenario seconds: each scenario's hard time limit is 3x its usual time (300 s at least).
      - if: matrix.kind == 'suite'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: suite-times.json
          key: suite-times-${{ github.sha }}
          restore-keys: suite-times-
      - name: Base tree
        if: matrix.kind != 'suite'
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
      - name: Run ${{ matrix.name }}
        env:
          NAME: ${{ matrix.name }}
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          echo "$NAME" > "$OUT/name.txt"
          head="$GITHUB_WORKSPACE" base="$RUNNER_TEMP/base"
          rss() { # "epoch pid kB" for every bedrock_server every 10 s into $1 until the job step ends (the report judges the
            # pid sampled longest: a cold runner's template generator runs first)
            while sleep 10; do for pid in $(pgrep -x bedrock_server); do kb=$(awk '/VmRSS/{print $2}' /proc/$pid/status 2>/dev/null); [ -n "$kb" ] && echo "$(date +%s) $pid $kb" >> "$1"; done; done
          }
          keep() { # the full profile JSON and run.mjs output of the side's newest suite --perf run, as <side>.perf-<n>.*
            d=$(ls -td "$BDS_HARNESS_LOGS"/suite-* 2>/dev/null | head -1)
            [ -n "$d" ] && for f in "$d"/perf-*.json "$d"/perf-*.out; do [ -f "$f" ] && cp "$f" "$OUT/$1.$(basename "$f")"; done
            return 0
          }
          case "$KIND" in
            soak)
              for side in base head; do
                (cd "${!side}" && node tools/test-bds/suite.mjs --perf "$PLAYERS" --perf-seconds "$SECONDS_" --json "$OUT/$side.json" > "$OUT/$side.out" 2>&1) || true
                keep "$side"
                tail -25 "$OUT/$side.out"
              done ;;
            bundle)
              # Both trees' bundles under this commit's harness, so only the packs differ; base, head, head, base, so
              # neither side always runs second (PIPE-07: the second of a pair was never the faster in six reports).
              for side in base head; do (cd "${!side}" && node tools/bundle.mjs --all > /dev/null); cp "${!side}/dist/realm_bundle.mcpack" "$RUNNER_TEMP/$side.mcpack"; done
              r=0
              for side in base head head base; do
                r=$((r + 1))
                node tools/test-bds/suite.mjs --perf "$PLAYERS" --perf-seconds "$SECONDS_" --perf-bundle "$RUNNER_TEMP/$side.mcpack" --json "$OUT/$side-$r.json" > "$OUT/$side-$r.out" 2>&1 || true
                keep "$side-$r"
                tail -25 "$OUT/$side-$r.out"
              done ;;
            listener)
              # One script event listener wake-up, engine side included (PIPE-03 (2)): each side's bundle idle and
              # unprofiled (--meter) with no events, 20 noop: and 20 realm: events a tick (20, not 5: a CPU figure of an
              # idle server moves by about 0.3 ms/tick run to run, and 5 x 67 wake-ups measured about 0.4); three rounds,
              # each in another order of sides and variants.
              for side in base head; do (cd "${!side}" && node tools/bundle.mjs --all > /dev/null); cp "${!side}/dist/realm_bundle.mcpack" "$RUNNER_TEMP/$side.mcpack"; done
              sha256sum "$RUNNER_TEMP"/base.mcpack "$RUNNER_TEMP"/head.mcpack
              cost() { # side variant round
                rate=20 ns=$2
                if [ "$2" = idle ]; then rate=0 ns=noop; fi
                node tools/test-bds/run.mjs --quiet --no-relay --flat --meter --profile-json "$OUT/$1-$2-$3.json" --bundle "$RUNNER_TEMP/$1.mcpack" --scenario tools/test-bds/examples/listener-cost.js --arg rate="$rate" --arg ns="$ns" --arg seconds="$SECONDS_" --timeout $((SECONDS_ + 300)) > "$OUT/$1-$2-$3.out" 2>&1 || true
                echo "$1 $2 $3: $(grep -m1 "CPU ms/tick" "$OUT/$1-$2-$3.out" || tail -1 "$OUT/$1-$2-$3.out")"
              }
              for r in 1 2 3; do
                case $r in 1) order="base head" vs="idle noop realm" ;; 2) order="head base" vs="realm noop idle" ;; 3) order="base head" vs="noop realm idle" ;; esac
                for side in $order; do for v in $vs; do cost "$side" "$v" "$r"; done; done
              done
              # BDS's own script profiler, a separate short pass under 5 realm: events a tick (PIPE-03 (3)).
              node tools/test-bds/run.mjs --quiet --no-relay --flat --meter --native-profile --bundle "$RUNNER_TEMP/head.mcpack" --scenario tools/test-bds/examples/listener-cost.js --arg rate=5 --arg ns=realm --arg seconds=20 --arg settle=5 --timeout 300 > "$OUT/native.out" 2>&1 || true
              sed -n '/^native profile:/,/^log:/p' "$OUT/native.out" | head -60
              cp -r "$BDS_HARNESS_LOGS"/*.native "$OUT/" 2>/dev/null || true ;;
            memory)
              for side in ${SIDE:-base head}; do
                rss "$OUT/$side.rss" & sampler=$!
                # The meter (PIPE-03 (1)): TPS, tick interval and CPU of the unprofiled run, when that tree's run.mjs has it.
                meter=""; if grep -q -- "--meter" "${!side}/tools/test-bds/run.mjs"; then meter="--meter --profile-json $OUT/$side.meter.json"; fi
                (cd "${!side}" && { node tools/test-bds/run.mjs --quiet --no-relay $meter --scenario tools/test-bds/examples/perf-soak.js --arg players="$PLAYERS" --arg seconds="$SECONDS_" --timeout $((SECONDS_ * 2 + 900)) > "$OUT/$side.out" 2>&1; echo $? > "$OUT/$side.exit"; }) || echo $? > "$OUT/$side.exit"
                kill "$sampler" || true
                echo "$side: exit $(cat "$OUT/$side.exit"), $(wc -l < "$OUT/$side.rss" 2>/dev/null || echo 0) RSS samples"
              done ;;
            scenario)
              n=$(node -e 'console.log(Math.max(1, Math.min(3, Math.floor(Number(process.env.REPEAT)) || 1)))')
              for r in $(seq 1 "$n"); do
                if [ $((r % 2)) = 1 ]; then order="base head"; else order="head base"; fi
                for side in $order; do
                  node tools/test-bds/scenario-soak.mjs --root "${!side}" --spec "$SPEC" --label "$SPEC" --json "$OUT/$side-$r.json" > "$OUT/$side-$r.out" 2>&1 || true
                  echo "$side $r: $(tail -1 "$OUT/$side-$r.out")"
                done
              done ;;
            suite)
              node tools/test-bds/suite.mjs --jobs 2 --retry --filter "$FILTER" --times suite-times.json --json "$OUT/suite.json" | tail -40 ;;
          esac
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validate-${{ matrix.name }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 30
      # The suite's scenario logs, so a scenario that failed here can be read (not named validate-*: the report job
      # downloads those).
      - if: always() && matrix.kind == 'suite'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.name }}
          path: ${{ runner.temp }}/bds-harness-logs
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: [plan, validate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, issues: write, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: validate-*
          path: ${{ runner.temp }}/results
      # The nightly memory soak's base: the previous nightly's head RSS, read as this run's base side.
      - if: needs.plan.outputs.reuse != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validate-memory-40-head
          run-id: ${{ needs.plan.outputs.reuse }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reused
      - if: needs.plan.outputs.reuse != ''
        run: |
          d="$RUNNER_TEMP/results/validate-memory-40-base"; mkdir -p "$d"
          echo memory-40-base > "$d/name.txt"
          for x in rss exit out; do [ -f "$RUNNER_TEMP/reused/head.$x" ] && cp "$RUNNER_TEMP/reused/head.$x" "$d/base.$x"; done
          ls -l "$d"
      # The flaky history of earlier runs (suite-times.json keeps the last 20).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: suite-times.json
          key: suite-times-${{ github.sha }}
          restore-keys: suite-times-
      # The A/A spreads and the pinned drift baseline (tools/test-bds/validate-report.mjs --history), saved again below
      # under this run's key so the cache stays in use.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: perf-history.json
          key: perf-history-${{ github.run_id }}
          restore-keys: perf-history-
      - name: Report
        id: report
        env:
          AA: ${{ needs.plan.outputs.aa == 'true' && '--aa' || '' }}
          PIN: ${{ inputs.pin && '--pin' || '' }}
          BASE_SHA: ${{ needs.plan.outputs.base }}
          BASE_FROM: ${{ needs.plan.outputs.from }}
          SPAN: ${{ needs.plan.outputs.span }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/test-bds/validate-report.mjs --dir "$RUNNER_TEMP/results" --base "$BASE_SHA" --base-from "$BASE_FROM" --span "$SPAN" --head "$GITHUB_SHA" --run "$RUN_URL" --matrix "$MATRIX" --out report.md --times suite-times.json --history perf-history.json $AA $PIN
      - name: Keep the A/A spreads and the drift baseline
        if: always() && hashFiles('perf-history.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: perf-history.json
          key: perf-history-${{ github.run_id }}
      - name: Keep the scenario seconds for pr-tests.yml's shards
        if: always() && hashFiles('suite-times.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: suite-times.json
          key: suite-times-${{ github.sha }}
      - name: Report issue
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # The nightly memory report is its own series: it never closes a merge's full report.
          # The A/A runs are their own series too ("A/A <sha> (master A/A)").
          WHAT: ${{ needs.plan.outputs.aa == 'true' && 'A/A' || github.event_name == 'schedule' && 'Memory' || 'Validation' }}
          SERIES: ${{ needs.plan.outputs.aa == 'true' && format('{0} A/A', github.ref_name) || github.event_name == 'schedule' && format('{0} nightly', github.ref_name) || github.ref_name }}
        run: |
          gh label create perf-report --color 5319e7 --description "Post-release validation (validate.yml)" --force > /dev/null
          url=$(gh issue create --title "$WHAT ${GITHUB_SHA::7} ($SERIES)" --body-file report.md --label perf-report)
          new=${url##*/}
          # One open report per series: close this series' older perf-report issues, superseded by the new one.
          gh issue list --label perf-report --state open --limit 200 --json number,title \
            --jq ".[] | select(.number != ${new}) | select(.title | endswith(\"(${SERIES})\")) | .number" |
            while read -r old; do gh issue close "$old" --comment "Superseded by #${new}." > /dev/null; done
      - name: Red when a scenario failed or a pair regressed
        if: always()
        env:
          STATUS: ${{ steps.report.outputs.status }}
        run: test "$STATUS" = ok
