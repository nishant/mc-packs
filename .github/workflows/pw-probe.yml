# Temporary probe for perf/release-checks (never merged): runs release.yml's hosting-tools install and the cached
# Playwright action exactly as the release and merge jobs do, then check-live against the live site (read-only).
name: pw-probe
on:
  push:
    branches: [perf/release-checks-pw-probe]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: mc-packs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nishant/hosting
          ref: master
          token: ${{ secrets.HOSTING_TOKEN }}
          persist-credentials: false
          path: hosting
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mc-packs/package-lock.json
            hosting/minecraft/package-lock.json
      - name: Install the hosting tools
        working-directory: hosting/minecraft
        timeout-minutes: 6
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Chromium for Playwright
        uses: ./mc-packs/.github/actions/playwright
        timeout-minutes: 10
        with:
          working-directory: hosting/minecraft
      - name: check-live against the live site (read-only)
        working-directory: hosting/minecraft
        continue-on-error: true
        run: timeout 600 node tools/check-live.mjs 2>&1 | tail -15
