# Runs every repo check and builds every pack on each pull request and push to master, so nothing reaches the
# Realm (or a public server) without `npm run check` and `npm run build` passing. Then a bounded smoke test starts the
# genuine Realm Bundle (every behavior pack merged into one script context, as on the Realm) on a Bedrock Dedicated Server
# with one simulated player: the bundle must load without script errors and every pack must answer /realm:help and
# /realm:diag. The scenarios a PR touches run in pr-tests.yml, and the whole suite after each merge in validate.yml.
# Running BDS needs Ubuntu 18 or later (the only Linux Mojang supports); the server archive comes from minecraft.net.
name: check
on:
  pull_request:
  push:
    branches: [master]
permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # check-versions compares each pack with its merge-base on origin/master
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
  bds-smoke:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Set private BDS paths on the allocated runner
        shell: bash
        run: |
          {
            echo "BDS_DIR=$RUNNER_TEMP/bds"
            echo "BDS_HARNESS_CACHE=$RUNNER_TEMP/bds-harness-cache"
            echo "BDS_HARNESS_TMP=$RUNNER_TEMP/bds-harness-tmp"
            echo "BDS_HARNESS_LOGS=$RUNNER_TEMP/bds-harness-logs"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bds
          key: bds-${{ runner.os }}-${{ hashFiles('tools/test-bds/lib/server.mjs') }}
      - run: node tools/test-bds/setup.mjs
        timeout-minutes: 8
      - name: BDS shared libraries are present
        run: "! ldd \"$BDS_DIR/bedrock_server\" | grep 'not found'"
      - run: mkdir -p "$BDS_HARNESS_CACHE" "$BDS_HARNESS_TMP" "$BDS_HARNESS_LOGS"
      - run: node tools/bundle.mjs --all
      - name: Realm Bundle smoke test (one script context)
        run: node tools/test-bds/run.mjs --quiet --flat --bundle dist/realm_bundle.mcpack --scenario tools/test-bds/examples/bundle-smoke.js --timeout 300
        timeout-minutes: 10
      - name: Keep the BDS logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bds-smoke-logs
          path: ${{ runner.temp }}/bds-harness-logs
          if-no-files-found: ignore
          retention-days: 7
